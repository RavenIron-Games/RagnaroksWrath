[1 - Core]

## Milliseconds per frame WorldTick may spend across all systems combined. Work that does not fit resumes next frame. Raise only if systems are visibly falling behind on a server with headroom.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0.25 to 16
TickBudgetMs = 2

## Cap on the real elapsed time a single zone can be credited in one contact. Default is 24 hours: a zone untouched for a month accrues a day of drift, not a month of it. This is the dial that keeps a long-idle world playable.
# Setting type: Single
# Default value: 86400
# Acceptable value range: From 60 to 2592000
MaxCreditSeconds = 86400

## Log every system pass rather than summaries. This mod's work is invisible by design; this is how you see it running.
# Setting type: Boolean
# Default value: false
VerboseLogging = false

## Seconds between writes of the zone drift store. Writing is skipped entirely when nothing has changed, and a final write always happens on shutdown, so this only bounds how much drift a hard crash can lose. Set 0 to disable periodic writes (shutdown save still occurs).
# Setting type: Single
# Default value: 120
# Acceptable value range: From 0 to 3600
AutosaveIntervalSeconds = 120

[10 - World state]

## Seconds between derivations of the world condition. Derived bottom-up from the zone store and weather every pass, never persisted: if it dies, the next pass recomputes the same answer.
