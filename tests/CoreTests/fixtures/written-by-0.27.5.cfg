# Acceptable value range: From 0 to 3
BiomeContactRadiusZones = 1

## Upper bound on zones drifted in one pass. Work already scales with players present rather than world size, so this is a backstop for a very crowded server: whatever does not fit resumes next tick from where it stopped, and the elapsed time it is owed keeps accruing meanwhile.
# Setting type: Int32
# Default value: 64
# Acceptable value range: From 1 to 1024
BiomeMaxZonesPerTick = 64

## How much of the 0..1 scale a zone recovers per hour of elapsed real time. Every field is a deviation from pristine, so this is the rate at which the land forgets. Default heals fully-damaged land in about 50 hours away.
# Setting type: Single
# Default value: 0.02
# Acceptable value range: From 0 to 1
BiomeRecoveryPerHour = 0.02

## How much Frost accumulates per hour, before the season's cold multiplier. Frost is the one value that builds with no event behind it: winter is a net gain against recovery, and the thaw is a net loss. Set 0 to make this system purely restorative.
# Setting type: Single
# Default value: 0.015
# Acceptable value range: From 0 to 1
BiomeFrostPressurePerHour = 0.015

[6 - Weather]

## Seconds between WeatherSystem passes. Also how quickly a storm's start and end are noticed, so keep it small: this reads state, it does not compute.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 1 to 60
WeatherIntervalSeconds = 5

## Shortest gap between storms, in real seconds. No storm can fire before this has passed since the last one ended.
# Setting type: Single
# Default value: 3600
# Acceptable value range: From 60 to 86400
StormMinIntervalSeconds = 3600

## Longest gap between storms. Chance ramps from zero at the minimum to certainty here, so a storm is guaranteed by this point rather than merely likely. A flat per-tick roll has a long tail, and a server that goes a real day without a storm looks broken rather than unlucky.
# Setting type: Single
# Default value: 10800
# Acceptable value range: From 120 to 172800
StormMaxIntervalSeconds = 10800

## How long a storm runs, in game seconds from when it starts: only a single-player pause stops it, as it stops every clock in the game. It runs out whether or not anyone is near it: a storm is weather, and it blows over unwatched.
# Setting type: Single
# Default value: 300
# Acceptable value range: From 30 to 3600
StormDurationSeconds = 300

## Radius of a storm's effect, in metres. Vanilla's own event range is 96; the banner and the gameplay multipliers both use this figure, so they cannot disagree about where the storm is.
# Setting type: Single
# Default value: 96
# Acceptable value range: From 32 to 1024
StormRangeMeters = 96

## RESERVED, AND CURRENTLY INERT - changing this changes nothing yet. It is meant as the fire risk multiplier inside a storm, but nothing reads it: a storm does not presently make fire worse. Storm lightning is a separate mechanism with its own settings under Fire, and it does work.
# Setting type: Single
# Default value: 1.8
# Acceptable value range: From 0 to 10
StormFireRiskMultiplier = 1.8

## RESERVED, AND CURRENTLY INERT - changing this changes nothing yet. It is the gameplay wind figure a storm would raise, kept apart from the wind the player can see, and WindSystem can already serve it per position - but no system asks yet. It is waiting on directional fire spread.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 10
StormWindMultiplier = 2

## Plague spread multiplier inside a storm.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0 to 10
StormPlagueSpreadMultiplier = 1.5

## THE ONLY SETTING IN THIS MOD THAT SELECTS AN ENVIRONMENT. Off by default: a storm is then a banner, gameplay multipliers and lightning under whatever sky the world already has. On, the storm shows StormForcedEnvironment for its duration through vanilla's own event override - the same mechanism boss events use - which the engine consults before the biome weather list. Verified 2026-09-03 to coexist with Seasonality, which only rewrites that list; a weather mod that patches the override path itself may still win, silently. Every CLIENT needs the same value, read at game launch: the sky is chosen on the player's machine, and a reconnect does not re-read this file.
# Setting type: Boolean
# Default value: false
StormsForceWeather = true

## THE WET STORM. Environment name for a storm that rolls rainy; used only when StormsForceWeather is on, and never read otherwise. KNOWN INTERACTION (verified live 2026-08-27, and the whole reason the two looks differ): ThunderStorm is a WET environment, and rain rightly suppresses storm lightning - so a wet storm is loud and drenching and drops no bolts.
# Setting type: String
# Default value: ThunderStorm
StormForcedEnvironment = ThunderStorm

## THE DRY STORM. Vanilla's 'Eikthyr' is dark sky and thunder with no rain, so lightning CAN strike under it - the same storm that soaks you does not burn you, and the one that stays dry might. Used only when StormsForceWeather is on. Set this to the same value as StormForcedEnvironment if you want every storm to look alike again.
# Setting type: String
# Default value: Eikthyr
StormDryEnvironment = Eikthyr

## Chance that a storm rolls DRY rather than wet, decided once per storm on the server. At the default of 0.5 the two are a coin flip, so the sight of a dry sky is the warning that this one can start fires. 0 makes every storm wet (what this mod did before storms had two faces), 1 makes every storm dry. Only meaningful when StormsForceWeather is on: with it off, both kinds run under the player's real sky and the roll changes nothing anyone can see.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
StormDryChance = 1

## Storms anchor on a player out in the WILD: anyone standing within this range of anything player-built (any object carrying a builder id - pieces and plants alike) does not draw storms. A storm centred on a homestead announces drama it cannot deliver - lightning grounds out on the standoff and cleared base ground gives fire nothing - so an overdue storm HOLDS until somebody steps outside their walls, then breaks. 0 disables the filter; capped at 64 by the 3x3-zone scan.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 0 to 64
StormAvoidBaseMeters = 30

[7 - Wind]

## Seconds between wind readings. Wind is read from EnvMan and cached; nothing in this mod ever writes it.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 1 to 60
WindIntervalSeconds = 5

[8 - Fire]

## Seconds between scorch passes. Only matters while FireFront (com.raveniron.firefront, 0.17.2+) is installed - without it FireSystem is dormant: fire simulation belongs to FireFront, this mod only records what fire does to the land.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 2 to 120
FireScorchIntervalSeconds = 10

## Scorch added per minute to any zone containing at least one active fire. Deliberately per-MINUTE and deliberately flat per zone: a fire's severity already shows up as more zones burning, so scaling by fire count too would double-count it. Default chars a zone fully after ~50 minutes of continuous burning; recovery is BiomeStateSystem's job and is slower than this.
# Setting type: Single
# Default value: 0.02
# Acceptable value range: From 0 to 1
FireScorchPerMinute = 0.02

## Lightning during Devastating Storms: a rare bolt ignites ground near a player standing in the storm, through FireFront's own fire simulation (needs FireFront installed with its ground spread enabled — without either, storms never strike). Bolts only ever land near an online player, never in rain, and never within LightningStandoffMeters of anything player-built. NOTE: 'never in rain' includes a rainy FORCED storm look — if StormsForceWeather is on, pick a dry environment ('Eikthyr') or storms will look wet and never strike.
# Setting type: Boolean
# Default value: true
StormLightningEnabled = true

## Mean minutes between strikes while a storm holds at least one player under a dry sky. Against the default 5-minute storm, 15 here means roughly one storm in three produces a bolt — storms should threaten fire, not promise it.
# Setting type: Single
# Default value: 15
# Acceptable value range: From 1 to 600
LightningMeanMinutes = 15

## Nearest a bolt lands to the player it picked. Far enough that a strike is never a targeted kill; the fire is the threat, not the bolt.
# Setting type: Single
# Default value: 15
# Acceptable value range: From 0 to 50
LightningRingMinMeters = 15

## Farthest a bolt lands from the player it picked. Kept inside the 64m announcement radius so whoever the storm strikes near always hears it.
# Setting type: Single
# Default value: 40
# Acceptable value range: From 10 to 60
LightningRingMaxMeters = 40

## No bolt lands within this range of anything player-built (any object carrying a builder id — pieces and plants alike). The storm menaces the wild, never the homestead; a blocked bolt is simply lost, not rerolled. Capped at 64 because the check scans the 3x3 zones around the strike.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 0 to 64
LightningStandoffMeters = 30

## Ground radius FireFront ignites at the strike point. Small on purpose: one bolt starts one fire, and the weather and the land decide what it becomes.
# Setting type: Single
# Default value: 2.5
# Acceptable value range: From 0.5 to 8
LightningIgniteRadiusMeters = 2.5

[9 - Plague]

## Seconds between spread passes. Spread is the EVENT half of plague; growth and cure run on the zone clock inside BiomeStateSystem and have their own pace.
# Setting type: Single
# Default value: 60
# Acceptable value range: From 10 to 600
PlagueSpreadIntervalSeconds = 60

## How much plague grows per hour of elapsed contact time in an already-infected zone, before the season multiplier. Against the recovery rate this decides curability by season: at defaults, spring (x1.4) grows at 0.042/h vs 0.02/h recovery, while winter (x0.5) manages 0.015/h and the zone heals. Set 0 to freeze all growth.
# Setting type: Single
# Default value: 0.03
# Acceptable value range: From 0 to 1
PlagueGrowthPerHour = 0.03

## How strongly zone Corruption feeds plague: growth x (1 + boost x Corruption). At 1.0 a fully corrupted zone doubles its plague growth.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 4
PlagueCorruptionBoost = 1

## Plague level a zone needs before it can infect its neighbours. Fresh seeds start far below this and only climb through player contact - which is the containment: the front advances exactly as far as people actually go.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0.05 to 1
PlagueSpreadThreshold = 0.5

## Plague level a newly infected zone starts at.
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0.01 to 0.5
PlagueSeedAmount = 0.05

## Outbreaks take root ORGANICALLY: a rare roll seeds sickness into ground players actually touch — likelier on corrupted or burnt land, carried by storms. Off = plagues start only by admin hand (the pre-0.22 behavior).
# Setting type: Boolean
# Default value: true
PlagueGenesisEnabled = true

## Mean real hours of played time between organic outbreaks on CLEAN ground. Blighted ground shortens it (up to 5x at full blight); a storm overhead multiplies again.
# Setting type: Single
# Default value: 12
# Acceptable value range: From 0.5 to 500
PlagueGenesisMeanHours = 3

## Chance per spread pass that each frontier zone is seeded, before the storm multiplier at that zone. Not per source: a zone bordered by three hotspots rolls once.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0 to 1
PlagueSpreadChance = 0.25

## Upper bound on zones seeded in one pass, as a backstop against a huge frontier all rolling well at once.
# Setting type: Int32
# Default value: 16
# Acceptable value range: From 1 to 256
PlagueMaxSpreadsPerTick = 16

[Meta]

## Which config LAYOUT this file was last written for. Not the mod's version, and not something to edit: the mod stamps it after migrating an older file, and reads it to know what is already done. Lower it and a migration that has already happened runs again; raise it and one that has not is skipped. A file written before this existed reads as 0, which is correct.
# Setting type: Int32
# Default value: 0
ConfigVersion = 1

